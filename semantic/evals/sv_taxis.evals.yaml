sv_name: FLEET_INTELLIGENCE.SEMANTIC.SV_TAXIS
evals:
  - question: "How many taxi trips were there for each shift type?"
    category: group_by
    gold_sql: |
      SELECT SHIFT_TYPE AS SHIFT_TYPE, COUNT(DISTINCT TRIP_ID) AS TOTAL_TRIPS
      FROM FLEET_INTELLIGENCE.FLEET_INTELLIGENCE_TAXIS.VW_TRIP_SUMMARY
      GROUP BY 1 ORDER BY TOTAL_TRIPS DESC
    sv_sql: |
      SELECT * FROM SEMANTIC_VIEW(
        FLEET_INTELLIGENCE.SEMANTIC.SV_TAXIS
        DIMENSIONS trips.shift_type METRICS trips.total_trips
      ) ORDER BY total_trips DESC

  - question: "What is the average trip distance in km for each shift type?"
    category: group_by
    gold_sql: |
      SELECT SHIFT_TYPE AS SHIFT_TYPE, AVG(ROUTE_DISTANCE_METERS) / 1000.0 AS AVG_DISTANCE_KM
      FROM FLEET_INTELLIGENCE.FLEET_INTELLIGENCE_TAXIS.VW_TRIP_SUMMARY
      GROUP BY 1 ORDER BY AVG_DISTANCE_KM DESC
    sv_sql: |
      SELECT * FROM SEMANTIC_VIEW(
        FLEET_INTELLIGENCE.SEMANTIC.SV_TAXIS
        DIMENSIONS trips.shift_type METRICS trips.avg_distance_km
      ) ORDER BY avg_distance_km DESC

  - question: "What is the maximum speed recorded for each driver?"
    category: group_by
    gold_sql: |
      SELECT DRIVER_ID AS DRIVER_ID, MAX(MAX_KMH) AS MAX_SPEED_KMH
      FROM FLEET_INTELLIGENCE.FLEET_INTELLIGENCE_TAXIS.VW_TRIP_SUMMARY
      GROUP BY 1 ORDER BY MAX_SPEED_KMH DESC
    sv_sql: |
      SELECT * FROM SEMANTIC_VIEW(
        FLEET_INTELLIGENCE.SEMANTIC.SV_TAXIS
        DIMENSIONS trips.driver_id METRICS trips.max_speed_kmh
      ) ORDER BY max_speed_kmh DESC

  - question: "How many distinct taxi drivers were active?"
    category: simple_aggregation
    gold_sql: |
      SELECT COUNT(DISTINCT DRIVER_ID) AS ACTIVE_DRIVERS
      FROM FLEET_INTELLIGENCE.FLEET_INTELLIGENCE_TAXIS.VW_TRIP_SUMMARY
    sv_sql: |
      SELECT * FROM SEMANTIC_VIEW(
        FLEET_INTELLIGENCE.SEMANTIC.SV_TAXIS METRICS trips.active_drivers
      )
