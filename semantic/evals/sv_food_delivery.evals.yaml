sv_name: FLEET_INTELLIGENCE.SEMANTIC.SV_FOOD_DELIVERY
evals:
  - question: "How many deliveries were there for each order status?"
    category: group_by
    gold_sql: |
      SELECT ORDER_STATUS AS ORDER_STATUS, COUNT(DISTINCT DELIVERY_ID) AS TOTAL_DELIVERIES
      FROM FLEET_INTELLIGENCE.FLEET_INTELLIGENCE_FOOD_DELIVERY.DELIVERIES
      GROUP BY 1 ORDER BY TOTAL_DELIVERIES DESC
    sv_sql: |
      SELECT * FROM SEMANTIC_VIEW(
        FLEET_INTELLIGENCE.SEMANTIC.SV_FOOD_DELIVERY
        DIMENSIONS deliveries.order_status METRICS deliveries.total_deliveries
      ) ORDER BY total_deliveries DESC

  - question: "What is the average delivery time in minutes for each courier?"
    category: group_by
    gold_sql: |
      SELECT COURIER_ID AS COURIER_ID, AVG(DELIVERY_TIME_MIN) AS AVG_DELIVERY_TIME
      FROM FLEET_INTELLIGENCE.FLEET_INTELLIGENCE_FOOD_DELIVERY.DELIVERIES
      GROUP BY 1 ORDER BY AVG_DELIVERY_TIME DESC
    sv_sql: |
      SELECT * FROM SEMANTIC_VIEW(
        FLEET_INTELLIGENCE.SEMANTIC.SV_FOOD_DELIVERY
        DIMENSIONS deliveries.courier_id METRICS deliveries.avg_delivery_time
      ) ORDER BY avg_delivery_time DESC

  - question: "How many distinct couriers made deliveries?"
    category: simple_aggregation
    gold_sql: |
      SELECT COUNT(DISTINCT COURIER_ID) AS ACTIVE_COURIERS
      FROM FLEET_INTELLIGENCE.FLEET_INTELLIGENCE_FOOD_DELIVERY.DELIVERIES
    sv_sql: |
      SELECT * FROM SEMANTIC_VIEW(
        FLEET_INTELLIGENCE.SEMANTIC.SV_FOOD_DELIVERY METRICS deliveries.active_couriers
      )

  - question: "What is the total number of orders for each restaurant?"
    category: group_by
    gold_sql: |
      SELECT RESTAURANT_NAME AS RESTAURANT_NAME, SUM(TOTAL_ORDERS) AS RESTAURANT_TOTAL_ORDERS
      FROM FLEET_INTELLIGENCE.FLEET_INTELLIGENCE_FOOD_DELIVERY.RESTAURANTS_ENRICHED
      GROUP BY 1 ORDER BY RESTAURANT_TOTAL_ORDERS DESC
    sv_sql: |
      SELECT * FROM SEMANTIC_VIEW(
        FLEET_INTELLIGENCE.SEMANTIC.SV_FOOD_DELIVERY
        DIMENSIONS restaurants.restaurant_name METRICS restaurants.restaurant_total_orders
      ) ORDER BY restaurant_total_orders DESC
