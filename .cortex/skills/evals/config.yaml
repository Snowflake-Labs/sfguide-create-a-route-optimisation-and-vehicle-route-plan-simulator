skills_root: ..

# Paths whose SKILL.md files are GENERATED deployment artifacts, not authored
# Cortex Code skills, and are excluded from discovery entirely (see
# lib/discovery.py for the measured effect of not doing this: quality sat at
# 19/44 permanently, with all 25 failures being artifacts, and xref/sql reported
# 44/44 against a true population of 18).
#
# By PATH, not by name: `exclude_skills` below matches names, and 26 generated
# names would go stale the moment a view is added.
exclude_paths:
  - "**/cowork_skills/**"   # build_cowork_skills.py output, read by Cortex Agents off a stage

# Hard floor on discovered authored skills. An exclude_paths pattern that is too
# broad would drop real skills and still print a green "N/N pass" - failing
# green, which is worse than the noise this replaced. Raise this when skills are
# added; if discovery drops below it, the run aborts.
min_authored_skills: 23
eval_types:
  - trigger
  - quality
  - xref
  - sql

# Skills kept in the repo as standalone demos/tombstones but NOT part of the
# vehicle/industry-AGNOSTIC architecture (install-fleet-apps). They are excluded
# from eval pass/fail accounting so the agnostic surface is the thing the gate
# protects. The folders still exist and remain invocable; remove a name here to
# bring it back under eval enforcement.
exclude_skills:
  - fleet-intelligence-ebike   # legacy per-vehicle demo (not in agnostic installer)
  - fleet-intelligence-car           # legacy per-vehicle demo
  - backload-matching                  # legacy industry-vertical demo (excluded pack)
  - freight-exchange                   # legacy industry-vertical demo (excluded pack)
  - retail-catchment                   # legacy industry-vertical demo

scoring:
  quality_pass_threshold: 10  # out of 13
  trigger_match_min_pct: 80  # % of should_trigger prompts that match

vague_phrases:
  - "validate things properly"
  - "ensure everything works"
  - "check things"
  - "do as needed"
  - "handle appropriately"

description_max_chars: 1024
body_max_words: 5000
