# Agent behavioral eval cases.
#
# Each case runs the deployed agent on `prompt`, then grades its assertions.
# Assertion types:
#   verb  - a VERB_ATTEMPT audit row exists for one of `verbs` with the given
#           outcome (default 'ok') since the turn started. Proves the synapse
#           envelope path and, for ORS-backed verbs, a LIVE engine call.
#   sql   - `text` is a read-only SELECT that must return a single OK column.
#           Substitutions: {{verb_attempt}} (audit table), {{start_ts}} (turn
#           start timestamp).
#   judge - `text` is a natural-language claim graded by CORTEX.COMPLETE over
#           the captured transcript (assistant text + tool calls + errors).
#   active-verify - `sql` is a read-only ground-truth SELECT (same {{...}} subs
#           as `sql`); its result is fed to CORTEX.COMPLETE which decides whether
#           the assistant's answer matches `claim` within optional `tolerance`.
#           Catches confidently-wrong numbers on text-to-SQL surfaces. Skipped
#           under --fast like judge.
#
# These target the User MCP bundle and the two load-bearing tenets:
# auditability (every verb writes VERB_ATTEMPT) and live routing (isochrone /
# optimization must call ORS, not read a precomputed table). The analyst cases
# additionally exercise the Cortex Analyst text-to-SQL tools (which do NOT write
# VERB_ATTEMPT, so they are graded by active-verify + judge, not verb).

agent_database: FLEET_INTELLIGENCE
agent_schema: SYNAPSE_USER
agent_name: FLEET_AGENT
verb_attempt_table: OPENROUTESERVICE_APP.ROUTING.VERB_ATTEMPT
judge_model: claude-4-sonnet

cases:
  - id: directions-sf
    prompt: >-
      Give me driving directions from the Ferry Building to Golden Gate Park
      in San Francisco.
    assertions:
      - type: verb
        verbs: [get_directions]
        description: get_directions verb was audited with outcome ok
      - type: sql
        description: no verb errored during this turn
        text: >-
          SELECT (COUNT(*) = 0) AS OK FROM {{verb_attempt}}
          WHERE OUTCOME = 'error' AND ACTOR = CURRENT_USER()
          AND AT >= '{{start_ts}}'
      - type: judge
        text: >-
          The assistant's answer describes a driving route and states both a
          distance and a travel time (duration).

  - id: isochrone-live
    prompt: >-
      Show me the area reachable within a 10 minute drive from Union Square
      in San Francisco.
    assertions:
      - type: verb
        verbs: [compute_isochrone]
        description: compute_isochrone verb was audited (proves live ORS call, not a precomputed table)
      - type: sql
        description: the isochrone verb call succeeded (no error outcome)
        text: >-
          SELECT (COUNT(*) = 0) AS OK FROM {{verb_attempt}}
          WHERE VERB = 'compute_isochrone' AND OUTCOME = 'error'
          AND ACTOR = CURRENT_USER() AND AT >= '{{start_ts}}'
      - type: judge
        text: >-
          The assistant returned a drive-time / reachability (isochrone) area
          for roughly a 10 minute threshold, not a straight-line radius.

  - id: optimize-routes
    prompt: >-
      Optimize a single-vehicle route that visits these San Francisco stops:
      Ferry Building, Coit Tower, Painted Ladies, and the Palace of Fine Arts.
    assertions:
      - type: verb
        verbs: [optimize_routes]
        description: optimize_routes verb was audited with outcome ok
      - type: sql
        description: the optimization verb produced no error_code this turn
        text: >-
          SELECT (COUNT(*) = 0) AS OK FROM {{verb_attempt}}
          WHERE VERB = 'optimize_routes' AND ERROR_CODE IS NOT NULL
          AND ACTOR = CURRENT_USER() AND AT >= '{{start_ts}}'
      - type: judge
        text: >-
          The assistant's answer presents an optimized visiting order for the
          multiple stops (a route plan), not just directions between two points.

  # --- Cortex Analyst text-to-SQL coverage (no VERB_ATTEMPT; graded by
  #     active-verify + judge) ---
  - id: analyst-fleet-ops-count
    prompt: >-
      Across the entire active dataset, how many trips are there in total?
      Give me the exact number.
    assertions:
      - type: judge
        text: >-
          The assistant answered with a specific total trip count and did not
          refuse or ask a clarifying question instead of answering.
      - type: active-verify
        description: stated total trip count matches the SV_FLEET_OPS source view
        claim: >-
          The assistant states a total number of trips. That number must equal
          the ground-truth trip count (the single value in the result).
        tolerance: exact integer match
        sql: >-
          SELECT COUNT(DISTINCT TRIP_ID) AS GROUND_TRUTH_TRIPS
          FROM FLEET_APP.FLEET_OPS.VW_TRIPS

  - id: analyst-catchment-pois
    prompt: >-
      How many points of interest (POIs) are in the catchment dataset in
      total? Give me the exact count.
    assertions:
      - type: judge
        text: >-
          The assistant answered with a specific total POI count and did not
          refuse or ask a clarifying question instead of answering.
      - type: active-verify
        description: stated POI count matches the SV_CATCHMENT source table
        claim: >-
          The assistant states a total number of POIs. That number must equal
          the ground-truth POI count (the single value in the result).
        tolerance: exact integer match
        sql: >-
          SELECT COUNT(DISTINCT POI_ID) AS GROUND_TRUTH_POIS
          FROM FLEET_INTELLIGENCE.CATCHMENT.POIS

  # --- render_view dynamic dashboard coverage (render_view IS a synapse verb) ---
  - id: render-view-custom
    prompt: >-
      Build me a custom one-off dashboard: a metric card showing the total
      number of trips, and a bar chart of trip count broken down by region.
      Render it as a new view; do not just link me to an existing page.
    assertions:
      - type: verb
        verbs: [render_view]
        description: render_view verb was audited with outcome ok
      - type: judge
        text: >-
          The assistant returned a dashboard / view specification (a layout with
          at least one area that has a component and a data query), rather than
          only a plain-text answer or only a link to an existing view.

  # --- deep_link regression -------------------------------------------------
  # deep_link failed 4 calls out of 4 on tib85385 with "URLSearchParams is not
  # defined": synapse compiles every verb into a LANGUAGE JAVASCRIPT procedure
  # and that runtime has no WHATWG URL APIs. tsc accepted it, esbuild bundled
  # it, the procedure created cleanly, and every static gate stayed green - so
  # only a live call could have caught it. check_verb_js_globals.py now blocks
  # the whole class; this case proves the verb still actually RUNS, which a
  # static scan cannot tell you.
  - id: deep-link-view
    prompt: >-
      Give me a link I can open to the Dwell Overview page for San Francisco.
    assertions:
      - type: verb
        verbs: [deep_link]
        description: deep_link verb was audited with outcome ok
      - type: sql
        description: deep_link did not error (regression guard for the JS-runtime fault)
        text: >-
          SELECT (COUNT(*) = 0) AS OK FROM {{verb_attempt}}
          WHERE VERB = 'deep_link' AND OUTCOME = 'error'
          AND ACTOR = CURRENT_USER() AND AT >= '{{start_ts}}'
      - type: judge
        text: >-
          The assistant supplied an actual https URL containing a query string
          (a "?" followed by at least one parameter), or clearly explained that
          the app endpoint is not provisioned. It did NOT report an internal
          error, and did NOT tell the user to contact an administrator or raise
          a bug.

  # --- unknown view id must be recoverable ---------------------------------
  # The agent guessed view_id "route_deviation", which does not exist. The error
  # is correct and names the tools to try, but the turn still dead-ends unless
  # the agent acts on it. This asserts recovery, not merely a clean failure.
  - id: deep-link-unknown-view
    prompt: >-
      Open the "route_deviation" view for me.
    assertions:
      - type: judge
        text: >-
          The assistant either opened a real view whose name is close to the one
          requested (for example a route deviation or detour page), or listed the
          view ids that do exist so the user can pick one. Simply reporting that
          "route_deviation" is not a valid view, with no alternatives and no
          lookup attempt, is a FAILURE.

  # --- governed path beats run_sql ----------------------------------------
  # The acceptance test for the in-band governed_note nudge. Prose guidance for
  # this exists in BOTH the agent spec and run_sql's tool description, and the
  # agent still answered dwell questions by hand-writing SQL against
  # FLEET_APP.DWELL.VW_DWELL_SESSIONS - which SV_DWELL_ANALYTICS models. Note a
  # query_* Cortex Analyst tool writes NO VERB_ATTEMPT row, so the evidence here
  # is the ABSENCE of a run_sql row plus a judged answer, not a verb assertion.
  - id: governed-path-dwell
    prompt: >-
      Which vehicle type has the most dwell time?
    assertions:
      - type: sql
        description: answered without hand-written SQL against a modelled object
        text: >-
          SELECT (COUNT(*) = 0) AS OK FROM {{verb_attempt}}
          WHERE VERB = 'run_sql' AND ACTOR = CURRENT_USER()
          AND AT >= '{{start_ts}}'
          AND UPPER(ARGS_JSON:sql::STRING) LIKE '%VW_DWELL_SESSIONS%'
      - type: judge
        text: >-
          The assistant answered with a specific vehicle type and a dwell figure.
          If it did use raw SQL against the dwell tables, it also said so and
          named the governed query_* tool that models this data - staying silent
          about it is a FAILURE.
