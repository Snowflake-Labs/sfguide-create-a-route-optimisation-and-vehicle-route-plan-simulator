# =============================================================================
# Data model (logical contract) - Fleet domain pack: marketplace (SELF-BUILDING)
# =============================================================================
# Absorbs the FLEET_INTELLIGENCE.MARKETPLACE view closure (VW_OFFERS, VW_PARTNERS,
# VW_PARTNER_HISTORY, VW_OFFER_ENRICHED, VW_LANE_HISTORY) into the pack. Leaves are
# CONFIG-filtered projections of shared raw sources (SYNTHETIC_DATASETS.UNIFIED
# V_*_CURRENT) + the domain base tables (RATE_INDEX, FACT_OFFER_ROUTES); the
# cross-entity enrichment + lane rollup are derived primitives. Consumer entities
# OFFER_ENRICHED + LANE_HISTORY keep the columns freight_exchange + SV_FREIGHT_MARKETPLACE bind to.
# =============================================================================

pack: marketplace
app_schema: FLEET_APP.MARKETPLACE

entities:
  # ---- Leaves (mapped; source-specific projections in entity-mapping) -------
  - name: OFFERS
    description: "Open freight offers with pickup/dropoff geo + naming (was VW_OFFERS)."
    access_pattern: mapped
    grain: "One row per offer"
    primary_key: OFFER_ID
    columns:
      - { name: OFFER_ID, type: VARCHAR }
      - { name: JOB_ID, type: VARCHAR }
      - { name: PARTNER_ID, type: VARCHAR }
      - { name: EQUIPMENT, type: VARCHAR }
      - { name: POSTED_AT, type: TIMESTAMP_NTZ }
      - { name: PRICE_PER_KM_USD, type: FLOAT }
      - { name: DISTANCE_KM, type: FLOAT }
      - { name: PRICE_USD, type: FLOAT }
      - { name: STATUS, type: VARCHAR }
  - name: PARTNERS
    description: "Partner master + trust badge (was VW_PARTNERS)."
    access_pattern: mapped
    grain: "One row per partner"
    primary_key: PARTNER_ID
    columns:
      - { name: PARTNER_ID, type: VARCHAR }
      - { name: NAME, type: VARCHAR }
      - { name: TRUST_BADGE, type: VARCHAR }
  - name: PARTNER_HISTORY
    description: "Per-shipment partner history rows (was VW_PARTNER_HISTORY)."
    access_pattern: mapped
    grain: "One row per shipment"
    columns:
      - { name: PARTNER_ID, type: VARCHAR }
      - { name: ORIGIN_COUNTRY, type: VARCHAR }
      - { name: DEST_COUNTRY, type: VARCHAR }
      - { name: EQUIPMENT, type: VARCHAR }
      - { name: OUTCOME, type: VARCHAR }
      - { name: EUR_PER_KM, type: FLOAT }
  - name: RATE_INDEX
    description: "Market rate index by equipment/week (base table)."
    access_pattern: mapped
    grain: "One row per equipment/week"
    columns: [ { name: EQUIPMENT, type: VARCHAR } ]
  - name: OFFER_ROUTES
    description: "Computed road routes per offer (base table FACT_OFFER_ROUTES)."
    access_pattern: mapped
    grain: "One row per offer route"
    columns: [ { name: OFFER_ID, type: VARCHAR } ]

  # ---- Consumer-facing derived primitives -----------------------------------
  - name: OFFER_ENRICHED
    description: "Offers enriched with partner trust, market badge, road route/detour (was VW_OFFER_ENRICHED)."
    access_pattern: derived
    derived_from: OFFERS
    depends_on: [PARTNERS, RATE_INDEX, OFFER_ROUTES]
    materialization: view
    replaces: FLEET_INTELLIGENCE.MARKETPLACE.VW_OFFER_ENRICHED
    columns:
      - { name: OFFER_ID, type: VARCHAR }
      - { name: MARKET_BADGE, type: VARCHAR }
      - { name: TRUST_BADGE, type: VARCHAR }
      - { name: ROUTE_DETOUR_BADGE, type: VARCHAR }
    sql: |
      WITH e AS (
        SELECT
          o.*,
          p.NAME             AS PARTNER_NAME,
          p.COUNTRY          AS PARTNER_COUNTRY,
          p.CREDIT_SCORE     AS PARTNER_CREDIT_SCORE,
          p.PAYMENT_DAYS_AVG AS PARTNER_PAYMENT_DAYS,
          p.KYC_STATUS       AS PARTNER_KYC,
          p.BLACKLIST_FLAG   AS PARTNER_BLACKLIST,
          p.TRUST_BADGE      AS TRUST_BADGE,
          ri.P25_USD_PER_KM  AS MARKET_P25,
          ri.P50_USD_PER_KM  AS MARKET_P50,
          ri.P75_USD_PER_KM  AS MARKET_P75,
          CASE
            WHEN ri.P50_USD_PER_KM IS NULL OR o.PRICE_PER_KM_USD IS NULL THEN NULL
            ELSE ROUND((o.PRICE_PER_KM_USD - ri.P50_USD_PER_KM) / ri.P50_USD_PER_KM * 100, 1)
          END AS PRICE_DELTA_PCT,
          CASE
            WHEN ri.P50_USD_PER_KM IS NULL OR o.PRICE_PER_KM_USD IS NULL THEN 'UNKNOWN'
            WHEN ABS((o.PRICE_PER_KM_USD - ri.P50_USD_PER_KM) / ri.P50_USD_PER_KM) <= 0.05 THEN 'AT_MARKET'
            WHEN o.PRICE_PER_KM_USD < ri.P50_USD_PER_KM THEN 'BELOW_MARKET'
            ELSE 'ABOVE_MARKET'
          END AS MARKET_BADGE
        FROM {src} o
        LEFT JOIN {schema}.VW_PARTNERS p ON p.PARTNER_ID = o.PARTNER_ID
        LEFT JOIN {schema}.VW_RATE_INDEX ri
          ON ri.EQUIPMENT = o.EQUIPMENT
         AND ri.WEEK = DATE_TRUNC('week', o.POSTED_AT)
      )
      SELECT
        e.*,
        fr.ROAD_KM,
        fr.ROAD_MIN,
        fr.GEOMETRY     AS ROUTE_GEOMETRY,
        fr.PROFILE      AS ROUTE_PROFILE,
        fr.COMPUTED_AT  AS ROUTE_COMPUTED_AT,
        CASE WHEN fr.ROAD_KM IS NOT NULL AND e.PRICE_USD IS NOT NULL AND fr.ROAD_KM > 0
             THEN e.PRICE_USD / fr.ROAD_KM
             ELSE e.PRICE_PER_KM_USD
        END AS PRICE_PER_ROAD_KM_USD,
        CASE WHEN fr.ROAD_KM IS NULL THEN 'PENDING_ROUTE'
             WHEN fr.ROAD_KM > e.DISTANCE_KM * 1.6 THEN 'DETOUR_HEAVY'
             WHEN fr.ROAD_KM > e.DISTANCE_KM * 1.3 THEN 'DETOUR_MODERATE'
             ELSE 'DIRECT'
        END AS ROUTE_DETOUR_BADGE
      FROM e
      LEFT JOIN {schema}.VW_OFFER_ROUTES fr
        ON fr.OFFER_ID = e.OFFER_ID AND fr.JOB_ID = e.JOB_ID

  - name: LANE_HISTORY
    description: "Per-lane partner performance rollup (was VW_LANE_HISTORY)."
    access_pattern: derived
    derived_from: PARTNER_HISTORY
    materialization: view
    replaces: FLEET_INTELLIGENCE.MARKETPLACE.VW_LANE_HISTORY
    group_by: [PARTNER_ID, ORIGIN_COUNTRY, DEST_COUNTRY, EQUIPMENT]
    columns:
      - { name: PARTNER_ID,     type: VARCHAR }
      - { name: ORIGIN_COUNTRY, type: VARCHAR }
      - { name: DEST_COUNTRY,   type: VARCHAR }
      - { name: EQUIPMENT,      type: VARCHAR }
      - { name: SHIPMENTS,      type: NUMBER, expr: "COUNT(*)" }
      - { name: ON_TIME,        type: NUMBER, expr: "SUM(CASE WHEN OUTCOME = 'DELIVERED' THEN 1 ELSE 0 END)" }
      - { name: LATE_CNT,       type: NUMBER, expr: "SUM(CASE WHEN OUTCOME = 'LATE' THEN 1 ELSE 0 END)" }
      - { name: DAMAGED_CNT,    type: NUMBER, expr: "SUM(CASE WHEN OUTCOME = 'DAMAGED' THEN 1 ELSE 0 END)" }
      - { name: AVG_EUR_PER_KM, type: FLOAT,  expr: "ROUND(AVG(EUR_PER_KM), 2)" }

  - name: CONFIG
    description: "Region/vehicle control row."
    access_pattern: context
    grain: "One row"
    columns:
      - { name: VEHICLE_TYPE, type: VARCHAR }
      - { name: REGION,       type: VARCHAR }
