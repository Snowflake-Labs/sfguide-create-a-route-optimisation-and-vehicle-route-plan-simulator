# Entity mapping - taxi pack - SOURCE: synthetic
# Self-building: leaves are CONFIG-filtered projections of raw
# SYNTHETIC_DATASETS.UNIFIED tables (the swap boundary). The TRIP_SUMMARY
# enrichment is defined source-agnostically in data-model.yaml. A customer swap
# rebinds these four leaves; consumers + SV_TAXIS are unchanged.
source_id: synthetic
description: "Bundled synthetic taxi data (raw UNIFIED projections)."
entities:
  - entity: TRIPS
    source_table: SYNTHETIC_DATASETS.UNIFIED.FACT_TRIPS
    materialization: view
    sql: |
      SELECT
          VEHICLE_ID, TRIP_ID, TRIP_START, TRIP_END,
          ORIGIN_POI_ID, DESTINATION_POI_ID,
          DURATION_MINUTES, DISTANCE_KM, ROUTE_GEOG, ORIGIN, DESTINATION, REGION
      FROM SYNTHETIC_DATASETS.UNIFIED.FACT_TRIPS
      WHERE VEHICLE_TYPE = (SELECT VEHICLE_TYPE FROM FLEET_INTELLIGENCE.FLEET_INTELLIGENCE_TAXIS.CONFIG LIMIT 1)
        AND REGION = (SELECT REGION FROM FLEET_INTELLIGENCE.FLEET_INTELLIGENCE_TAXIS.CONFIG LIMIT 1)

  - entity: TELEMETRY
    source_table: SYNTHETIC_DATASETS.UNIFIED.FACT_VEHICLE_TELEMETRY
    materialization: view
    sql: |
      SELECT TRIP_ID, SPEED_KMH
      FROM SYNTHETIC_DATASETS.UNIFIED.FACT_VEHICLE_TELEMETRY
      WHERE VEHICLE_TYPE = (SELECT VEHICLE_TYPE FROM FLEET_INTELLIGENCE.FLEET_INTELLIGENCE_TAXIS.CONFIG LIMIT 1)

  - entity: POIS
    source_table: SYNTHETIC_DATASETS.UNIFIED.DIM_POIS
    materialization: view
    sql: |
      SELECT LOCATION_ID, NAME, CATEGORY, LAT, LNG
      FROM SYNTHETIC_DATASETS.UNIFIED.DIM_POIS

  - entity: FLEET
    source_table: SYNTHETIC_DATASETS.UNIFIED.DIM_FLEET
    materialization: view
    sql: |
      SELECT VEHICLE_ID, SHIFT_TYPE
      FROM SYNTHETIC_DATASETS.UNIFIED.DIM_FLEET
      WHERE VEHICLE_TYPE = (SELECT VEHICLE_TYPE FROM FLEET_INTELLIGENCE.FLEET_INTELLIGENCE_TAXIS.CONFIG LIMIT 1)

  - entity: CONFIG
    source_table: FLEET_INTELLIGENCE.FLEET_INTELLIGENCE_TAXIS.CONFIG
    materialization: view
    passthrough: true
