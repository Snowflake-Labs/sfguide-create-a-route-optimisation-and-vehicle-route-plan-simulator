# Entity mapping - backload pack - SOURCE: synthetic
# Leaves project shared SYNTHETIC_DATASETS.UNIFIED.V_*_CURRENT (CONFIG-filtered) +
# the cross-app reference OPENROUTESERVICE_APP.CORE.VEHICLE_CLASS_PROFILE. TRAILERS +
# EXTERNAL_OFFERS are derived in data-model.yaml. PROPOSAL_DECISIONS is the base log.
source_id: synthetic
description: "Bundled synthetic backload-matching data."
entities:
  - entity: TRIPS_CURRENT
    source_table: SYNTHETIC_DATASETS.UNIFIED.V_FACT_TRIPS_CURRENT
    materialization: view
    sql: |
      SELECT VEHICLE_ID, DESTINATION_LON, DESTINATION_LAT, DESTINATION_POI_ID, TRIP_END
      FROM SYNTHETIC_DATASETS.UNIFIED.V_FACT_TRIPS_CURRENT
      WHERE REGION = (SELECT REGION FROM FLEET_INTELLIGENCE.BACKLOAD_MATCHING.CONFIG LIMIT 1)
        AND VEHICLE_TYPE = (SELECT VEHICLE_TYPE FROM FLEET_INTELLIGENCE.BACKLOAD_MATCHING.CONFIG LIMIT 1)

  - entity: POIS_CURRENT
    source_table: SYNTHETIC_DATASETS.UNIFIED.V_DIM_POIS_CURRENT
    materialization: view
    sql: |
      SELECT LOCATION_ID, NAME, LAT, LNG
      FROM SYNTHETIC_DATASETS.UNIFIED.V_DIM_POIS_CURRENT
      WHERE REGION = (SELECT REGION FROM FLEET_INTELLIGENCE.BACKLOAD_MATCHING.CONFIG LIMIT 1)

  - entity: FLEET_CURRENT
    source_table: SYNTHETIC_DATASETS.UNIFIED.V_DIM_FLEET_CURRENT
    materialization: view
    sql: |
      SELECT VEHICLE_ID, REGION, VEHICLE_TYPE, HOME_LOCATION_ID, BATTERY_RANGE_KM
      FROM SYNTHETIC_DATASETS.UNIFIED.V_DIM_FLEET_CURRENT
      WHERE REGION = (SELECT REGION FROM FLEET_INTELLIGENCE.BACKLOAD_MATCHING.CONFIG LIMIT 1)
        AND VEHICLE_TYPE = (SELECT VEHICLE_TYPE FROM FLEET_INTELLIGENCE.BACKLOAD_MATCHING.CONFIG LIMIT 1)

  - entity: FREIGHT_OFFERS
    source_table: SYNTHETIC_DATASETS.UNIFIED.V_FACT_FREIGHT_OFFERS_CURRENT
    materialization: view
    sql: |
      SELECT OFFER_ID, SOURCE, REGION, PICKUP_POI_ID, DROPOFF_POI_ID,
             PICKUP_LON, PICKUP_LAT, DROPOFF_LON, DROPOFF_LAT,
             PICKUP_FROM_TS, PICKUP_TO_TS, PRODUCT, PRICE_USD, HAZMAT, LISTING_TEXT, POSTED_AT
      FROM SYNTHETIC_DATASETS.UNIFIED.V_FACT_FREIGHT_OFFERS_CURRENT
      WHERE REGION = (SELECT REGION FROM FLEET_INTELLIGENCE.BACKLOAD_MATCHING.CONFIG LIMIT 1)

  - entity: VEHICLE_CLASS_PROFILE
    source_table: OPENROUTESERVICE_APP.CORE.VEHICLE_CLASS_PROFILE
    materialization: view
    passthrough: true

  - entity: PROPOSAL_DECISIONS
    source_table: FLEET_INTELLIGENCE.BACKLOAD_MATCHING.PROPOSAL_DECISIONS
    materialization: view
    passthrough: true

  - entity: CONFIG
    source_table: FLEET_INTELLIGENCE.BACKLOAD_MATCHING.CONFIG
    materialization: view
    passthrough: true
