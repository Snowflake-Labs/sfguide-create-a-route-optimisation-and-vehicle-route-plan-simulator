# Entity mapping - food_delivery pack - SOURCE: synthetic
# Self-building: leaves are CONFIG-filtered projections of raw SYNTHETIC_DATASETS.UNIFIED
# (FACT_TRIPS, DIM_POIS). DELIVERIES + RESTAURANTS_ENRICHED are derived in data-model.yaml.
source_id: synthetic
description: "Bundled synthetic food-delivery data (raw UNIFIED projections)."
entities:
  - entity: TRIPS
    source_table: SYNTHETIC_DATASETS.UNIFIED.FACT_TRIPS
    materialization: view
    sql: |
      SELECT TRIP_ID, VEHICLE_ID, ORIGIN_POI_ID, TRIP_START, STATUS,
             ORIGIN, DESTINATION, ROUTE_GEOG, DURATION_MINUTES, DISTANCE_KM, REGION
      FROM SYNTHETIC_DATASETS.UNIFIED.FACT_TRIPS
      WHERE VEHICLE_TYPE = (SELECT VEHICLE_TYPE FROM FLEET_INTELLIGENCE.FLEET_INTELLIGENCE_FOOD_DELIVERY.CONFIG LIMIT 1)
        AND REGION = (SELECT REGION FROM FLEET_INTELLIGENCE.FLEET_INTELLIGENCE_FOOD_DELIVERY.CONFIG LIMIT 1)

  - entity: POIS
    source_table: SYNTHETIC_DATASETS.UNIFIED.DIM_POIS
    materialization: view
    sql: |
      SELECT LOCATION_ID, NAME, POINT_GEOM, LOCATION_TYPE, REGION
      FROM SYNTHETIC_DATASETS.UNIFIED.DIM_POIS
      WHERE REGION = (SELECT REGION FROM FLEET_INTELLIGENCE.FLEET_INTELLIGENCE_FOOD_DELIVERY.CONFIG LIMIT 1)

  - entity: CONFIG
    source_table: FLEET_INTELLIGENCE.FLEET_INTELLIGENCE_FOOD_DELIVERY.CONFIG
    materialization: view
    passthrough: true
