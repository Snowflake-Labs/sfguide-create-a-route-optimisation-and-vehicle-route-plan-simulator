# =============================================================================
# Data model (logical contract) - Fleet domain pack: food_delivery (SELF-BUILDING)
# =============================================================================
# Absorbs FLEET_INTELLIGENCE.FLEET_INTELLIGENCE_FOOD_DELIVERY.{DELIVERIES,
# RESTAURANTS_ENRICHED} into the pack. Leaves = CONFIG-filtered projections of raw
# SYNTHETIC_DATASETS.UNIFIED (FACT_TRIPS, DIM_POIS); DELIVERIES + RESTAURANTS_ENRICHED
# are derived. Pack no longer depends on the legacy food-delivery schema views.
# =============================================================================

pack: food_delivery
app_schema: FLEET_APP.FOOD_DELIVERY

entities:
  - name: TRIPS
    description: "Raw delivery trips for active vehicle/region."
    access_pattern: mapped
    grain: "One row per trip"
    primary_key: TRIP_ID
    columns:
      - { name: TRIP_ID, type: VARCHAR }
      - { name: VEHICLE_ID, type: VARCHAR }
      - { name: ORIGIN_POI_ID, type: VARCHAR }
      - { name: TRIP_START, type: TIMESTAMP_NTZ }
      - { name: STATUS, type: VARCHAR }
      - { name: ORIGIN, type: GEOGRAPHY }
      - { name: DESTINATION, type: GEOGRAPHY }
      - { name: ROUTE_GEOG, type: GEOGRAPHY }
      - { name: DURATION_MINUTES, type: FLOAT }
      - { name: DISTANCE_KM, type: FLOAT }
  - name: POIS
    description: "Region POIs (restaurant naming + restaurant master)."
    access_pattern: mapped
    grain: "One row per POI"
    primary_key: LOCATION_ID
    columns:
      - { name: LOCATION_ID, type: VARCHAR }
      - { name: NAME, type: VARCHAR }
      - { name: POINT_GEOM, type: GEOGRAPHY }
      - { name: LOCATION_TYPE, type: VARCHAR }
      - { name: REGION, type: VARCHAR }

  - name: DELIVERIES
    description: "Per-delivery view (trip enriched with restaurant name)."
    access_pattern: derived
    derived_from: TRIPS
    depends_on: [POIS]
    materialization: view
    replaces: FLEET_INTELLIGENCE.FLEET_INTELLIGENCE_FOOD_DELIVERY.DELIVERIES
    columns:
      - { name: DELIVERY_ID, type: VARCHAR }
      - { name: COURIER_ID, type: VARCHAR }
      - { name: RESTAURANT_NAME, type: VARCHAR }
    sql: |
      SELECT
          t.TRIP_ID          AS DELIVERY_ID,
          t.VEHICLE_ID       AS COURIER_ID,
          p.NAME             AS RESTAURANT_NAME,
          t.ORIGIN_POI_ID    AS RESTAURANT_ID,
          t.TRIP_START       AS ORDER_TIME,
          t.STATUS           AS ORDER_STATUS,
          t.ORIGIN           AS PICKUP_LOCATION,
          t.DESTINATION      AS DROPOFF_LOCATION,
          t.DESTINATION      AS CUSTOMER_LOCATION,
          t.ROUTE_GEOG       AS GEOMETRY,
          t.DURATION_MINUTES AS DELIVERY_TIME_MIN,
          t.DISTANCE_KM      AS DISTANCE_KM
      FROM {src} t
      LEFT JOIN {schema}.VW_POIS p ON t.ORIGIN_POI_ID = p.LOCATION_ID

  - name: RESTAURANTS_ENRICHED
    description: "Per-restaurant order volume + avg delivery time."
    access_pattern: derived
    derived_from: POIS
    depends_on: [TRIPS]
    materialization: view
    replaces: FLEET_INTELLIGENCE.FLEET_INTELLIGENCE_FOOD_DELIVERY.RESTAURANTS_ENRICHED
    columns:
      - { name: RESTAURANT_ID, type: VARCHAR }
      - { name: TOTAL_ORDERS, type: NUMBER }
      - { name: AVG_DELIVERY_TIME_MIN, type: FLOAT }
    sql: |
      SELECT
          p.LOCATION_ID            AS RESTAURANT_ID,
          p.NAME                   AS RESTAURANT_NAME,
          ANY_VALUE(p.POINT_GEOM)  AS LOCATION,
          COUNT(t.TRIP_ID)         AS TOTAL_ORDERS,
          ROUND(AVG(t.DURATION_MINUTES), 1) AS AVG_DELIVERY_TIME_MIN,
          p.REGION
      FROM {src} p
      LEFT JOIN {schema}.VW_TRIPS t ON p.LOCATION_ID = t.ORIGIN_POI_ID
      WHERE p.LOCATION_TYPE = 'RESTAURANT'
      GROUP BY p.LOCATION_ID, p.NAME, p.REGION

  - name: CONFIG
    description: "Region/vehicle control row."
    access_pattern: context
    grain: "One row"
    columns:
      - { name: VEHICLE_TYPE, type: VARCHAR }
      - { name: REGION,       type: VARCHAR }
