# Gate registry - the single list of every quality gate in this repo.
#
# Why it exists: the gates used to live inside .githooks/pre-commit, which runs
# only when a developer opts in (core.hooksPath) and skipped ~20 gates unless
# matching paths were staged. Six checks and twelve negative tests were wired
# into nothing at all, and check_no_brands sat red for three weeks unseen. The
# registry is what run_gates.py executes - in CI on every PR (scope static) and
# after a fresh install (scope live) - and check_gate_registry.py fails if any
# gate exists outside it.
#
# Every gate must also carry a NEGATIVE test: a driver that re-introduces the
# defect the gate exists to catch and asserts the gate convicts it. A gate that
# has never been seen to fail is documentation, not a gate. Gates without one
# are listed under debt.missing_negative, which may only SHRINK
# (check_gate_registry.py compares it against the base revision).
#
# Fields
#   id        unique, snake_case
#   run       command, relative to the repo root; {conn} = Snowflake connection
#   negative  command for the negative test, `self` when `run` IS a negative
#             test, or null (then the id must be in debt.missing_negative)
#   scope     static - no Snowflake account, runs in CI
#             live   - needs an installed account, runs from the e2e harness
#   needs     optional setup the runner performs first: `npm-ci:<dir>`
#   why       one line: the defect class it catches

version: 1

gates:
