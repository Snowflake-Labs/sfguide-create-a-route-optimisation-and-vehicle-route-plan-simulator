# Image tag MUST match openrouteservice_app/image-versions.env ($DOWNLOADER_TAG).
# Run scripts/check_image_versions.sh to verify before uploading this spec to the stage.
spec:
  containers:
    - name: downloader
      image: /openrouteservice_app/core/image_repository/downloader:v0.0.9
      env:
        # Parallel byte-range connections for large range-capable downloads.
        # Multiplies effective throughput against per-connection throttling
        # (e.g. Geofabrik ~1 MB/s) so continental PBFs finish under the SQL
        # provisioning poll ceiling. Capped at 8 in the service code.
        DOWNLOAD_CONCURRENCY: "6"
        # Per-segment retry budget. A retry RESUMES the segment from the byte
        # count already on disk (Range start shifted, file opened for append),
        # so a broken connection costs seconds instead of re-fetching the whole
        # segment. Before that fix a 5.8 GB segment needed ~1.6h of unbroken TCP
        # per attempt and Europe could never finish.
        DOWNLOAD_MAX_RETRIES: "10"
        # Read timeout (seconds) for a segment body read. Geofabrik stalls for
        # minutes under load; a short timeout turns a stall into a failed attempt.
        DOWNLOAD_READ_TIMEOUT: "600"
        # Target bytes per byte-range segment. Fixed-size segments keep sidecar
        # progress fine-grained instead of a handful of multi-GB units.
        DOWNLOAD_SEGMENT_BYTES: "536870912"
      resources:
        requests:
          cpu: "0.5"
          memory: "1Gi"
        limits:
          cpu: "1"
          memory: "2Gi"
      volumeMounts:
        - name: ors-spcs-stage
          mountPath: /downloads/ors_spcs_stage
        - name: ors-graphs-spcs-stage
          mountPath: /downloads/ors_graphs_spcs_stage
        - name: ors-elevation-cache-spcs-stage
          mountPath: /downloads/ors_elevation_cache_spcs_stage
  endpoints:
    - name: downloader
      port: 8081
      public: false
  volumes:
    - name: ors-spcs-stage
      source: "@CORE.ORS_SPCS_STAGE"
    - name: ors-graphs-spcs-stage
      source: "@CORE.ORS_GRAPHS_SPCS_STAGE"
    - name: ors-elevation-cache-spcs-stage
      source: "@CORE.ORS_ELEVATION_CACHE_SPCS_STAGE"
