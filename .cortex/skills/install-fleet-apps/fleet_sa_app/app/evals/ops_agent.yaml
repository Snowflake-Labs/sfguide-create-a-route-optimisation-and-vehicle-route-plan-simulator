# Agent evaluation run config - FLEET_OPS_AGENT (operator).
#
# answer_correctness IS DELIBERATELY ABSENT.
# This agent's capabilities are almost entirely synapse MCP verbs, and evaluations
# do not call MCP tools ("the agent doesn't call any MCP server tool during the
# run"). Scoring answer correctness would therefore mark the agent wrong for a
# platform limitation on every operational question, or - if the rubric were
# loosened to compensate - mark it right for answering nothing. Neither number
# would mean anything.
#
# tool_execution_accuracy IS ALSO ABSENT for the same reason: the ops dataset's
# ground-truth invocations name the single non-MCP analyst tool (query_deployment),
# but the real ops surface is MCP verbs that the evaluation cannot invoke.
#
# What IS measurable, and is measured here:
#   tool_selection_accuracy - deterministic, and the ops dataset's ground truth
#                             names the one non-MCP tool that should be chosen
#                             (query_deployment) for each history question.
#   logical_consistency     - reference-free; catches an orchestrator that
#                             contradicts its own instructions, answers a
#                             live-state question from history, or claims a
#                             destructive action succeeded.
#
# The MCP verb path is covered instead by .cortex/skills/evals/run_agent_evals.py,
# which asserts against the VERB_ATTEMPT audit table on a live deployment.
#
# See fleet_agent.yaml for why there is no dataset: block.

evaluation:
  agent_params:
    agent_name: "FLEET_INTELLIGENCE.SYNAPSE_USER.FLEET_OPS_AGENT"
    agent_type: "CORTEX AGENT"
    # DEFAULT, not LAST - see fleet_agent.yaml for why binding a run to the mutable
    # live/draft spec silently destroys it.
    agent_version: "DEFAULT"
  run_params:
    label: "Fleet ops agent baseline"
    description: "Deployment-history tool selection and orchestration consistency. answer_correctness omitted because MCP verbs are not invoked during evaluations."
  source_metadata:
    type: "dataset"
    dataset_name: "FLEET_INTELLIGENCE.EVALS.EVAL_DS_FLEET_OPS_AGENT"

# METRIC VERSIONS. Pinned to v3 per the Snowflake best-practices guide. See
# fleet_agent.yaml for the full rationale (1M context, deprecating v1 judge).
metrics:
  - name: "logical_consistency"
    version: "v3"
  - name: "tool_selection_accuracy"
    version: "v3"
