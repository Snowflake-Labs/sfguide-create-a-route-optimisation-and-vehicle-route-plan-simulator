# Agent evaluation run config - FLEET_AGENT (consumer).
#
# NO `dataset:` BLOCK ON PURPOSE. When EXECUTE_AI_EVALUATION('START', ...) runs
# with a dataset: block present it tries to create the dataset on EVERY run and
# fails once the name exists - even when only run_name changed. The dataset is
# created once by scripts/setup_agent_evals.sh via SYSTEM$CREATE_EVALUATION_DATASET
# and referenced here by name.
#
# This agent's routing capability is a synapse MCP verb, and evaluations do not
# call MCP tools, so the dataset asks only Cortex Analyst / Cortex Search
# questions plus boundary cases. The MCP path is covered by the separate live
# harness .cortex/skills/evals/run_agent_evals.py. See agent_evals.sql.

evaluation:
  agent_params:
    agent_name: "FLEET_INTELLIGENCE.SYNAPSE_USER.FLEET_AGENT"
    agent_type: "CORTEX AGENT"
    # LAST = the most recently committed version. Pin an explicit VERSION$N once a
    # baseline exists, so a scheduled run cannot score differently for reasons
    # unrelated to the dataset.
    agent_version: "LAST"
  run_params:
    label: "Fleet consumer agent baseline"
    description: "Cortex Analyst and Cortex Search coverage plus boundary cases. MCP routing verbs are out of scope for evaluations."
  source_metadata:
    type: "dataset"
    dataset_name: "FLEET_INTELLIGENCE.EVALS.EVAL_DS_FLEET_AGENT"

# METRIC VERSIONS. Snowflake rejects an explicit `version: "v1"` with "Version 'v1'
# is not valid. To reference the v1 metric, omit the version field and use
# '<metric>' directly." - v1 is the default and is addressed by naming the metric
# as a plain string. Pin an explicit version (v2 / v3) once your account allows
# their judge models: scores from different metric versions are NOT comparable and
# Snowsight renders each version as its own chart and column.
metrics:
  - "answer_correctness"
  - "logical_consistency"
  - "tool_selection_accuracy"
