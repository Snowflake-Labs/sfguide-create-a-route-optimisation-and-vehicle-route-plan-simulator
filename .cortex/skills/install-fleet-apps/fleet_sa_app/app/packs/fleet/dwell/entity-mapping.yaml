# Entity mapping - dwell pack - SOURCE: synthetic
# Self-building: leaf projections are shaped from SYNTHETIC_DATASETS.UNIFIED via
# `sql:` bodies (source-specific WHERE/QUALIFY/CASE). The derived analytic DAG is
# defined source-agnostically in data-model.yaml. A customer swap replaces the
# four leaf `sql:` bindings (or supplies column mappings) and regenerates; the
# derived primitives and all consumers stay unchanged.
#
# MULTI-REGION BY CONSTRUCTION. These leaves deliberately do NOT filter on
# FLEET_INTELLIGENCE.DWELL_ANALYSIS.CONFIG. That filter used to make the whole
# dwell layer single-region: CONFIG holds ONE row, so every other loaded dataset
# was excluded before the first aggregate - not empty, structurally invisible.
# Because CONFIG is writable at runtime (the /api/region promote path and the
# ops verb set_active_context, which an agent can call), the same question
# returned different data at different times, and a cross-domain question mixed
# regions whenever two CONFIG tables had drifted apart.
#
# REGION and VEHICLE_TYPE are carried through the DAG as ordinary dimensions
# instead, so the consumer (dashboard scope arg, or a semantic-view WHERE from
# Cortex Analyst) chooses the slice. CONFIG survives as a DEFAULT-SELECTION
# HINT only - read by the app to preselect the context bar, never to filter.
# Do NOT reintroduce a `CONFIG LIMIT 1` predicate here; check_region_scoping.py
# fails the build if you do.
#
# Safe because IDs are globally unique, not per-region: measured 0 colliding
# VEHICLE_ID / LOCATION_ID / TRIP_ID across datasets, so the sessionization
# windows (PARTITION BY VEHICLE_ID) and the enrichment joins cannot fan out.
source_id: synthetic
description: "Bundled synthetic dwell data (projection views over SYNTHETIC_DATASETS.UNIFIED)."
entities:
  - entity: VEHICLE_TELEMETRY
    source_table: SYNTHETIC_DATASETS.UNIFIED.FACT_VEHICLE_TELEMETRY
    materialization: view
    sql: |
      SELECT
          t.TELEMETRY_ID, t.VEHICLE_ID, t.TRIP_ID, t.TS, t.SPEED_KMH,
          t.HEADING_DEG, t.GPS_ACCURACY_M,
          CASE
              WHEN t.STATUS = 'DWELL_ORIGIN' AND t.LOCATION_TYPE IN ('WAREHOUSE', 'LOGISTICS') THEN 'DWELL_WAREHOUSE'
              WHEN t.STATUS = 'DWELL_ORIGIN' AND t.LOCATION_TYPE IN ('RESTAURANT', 'STORE', 'ADDRESS') THEN 'DWELL_STORE'
              WHEN t.STATUS = 'DWELL_ORIGIN' THEN 'DWELL_DESTINATION'
              WHEN t.STATUS = 'DWELL_REST' THEN 'DWELL_REST_STOP'
              WHEN t.STATUS = 'DWELL_RECHARGE' THEN 'DWELL_REST_STOP'
              WHEN t.STATUS = 'DWELL_DETOUR' THEN 'DWELL_DETOUR'
              ELSE t.STATUS
          END AS STATUS,
          t.IS_SPEEDING, t.IS_HOS_VIOLATION, t.IS_DETOUR,
          t.LOCATION_ID, t.LOCATION_TYPE, t.POINT_INDEX, t.ODOMETER_KM,
          t.POINT_GEOM, t.VEHICLE_TYPE, t.REGION
      FROM SYNTHETIC_DATASETS.UNIFIED.FACT_VEHICLE_TELEMETRY t
      QUALIFY ROW_NUMBER() OVER (PARTITION BY t.TELEMETRY_ID ORDER BY t.TS) = 1

  - entity: VEHICLE_FLEET
    source_table: SYNTHETIC_DATASETS.UNIFIED.DIM_FLEET
    materialization: view
    sql: |
      SELECT
          f.VEHICLE_ID, f.HOME_LOCATION_ID AS HOME_BASE_ID,
          f.DRIVER_PROFILE, f.OPERATING_MODE, f.SHIFT_TYPE, f.BASE_SPEED_KMH,
          f.VEHICLE_TYPE, f.REGION,
          FLEET_APP.CORE.REGION_LABEL(f.REGION) AS REGION_LABEL,
          f.REGION AS HOME_BASE_NAME,
          -- Dispatch state. IS_GHOST means the generator deliberately parked
          -- this vehicle at its home POI for the GHOST_* day window, emitting
          -- only IDLE pings with no TRIP_ID. When the window covers the whole
          -- horizon the vehicle has NO trips at all, hence no actual/expected
          -- path to draw - which is the honest answer to "show me this
          -- vehicle's route", rather than the dataset looking incomplete.
          -- NULL on datasets generated before the column existed, so it is
          -- COALESCEd to FALSE (assume dispatched) rather than reclassifying
          -- every legacy vehicle as parked.
          COALESCE(f.IS_GHOST, FALSE) AS IS_GHOST,
          f.GHOST_START_DAY, f.GHOST_END_DAY
      FROM SYNTHETIC_DATASETS.UNIFIED.DIM_FLEET f
      QUALIFY ROW_NUMBER() OVER (PARTITION BY f.VEHICLE_ID ORDER BY f.VEHICLE_ID) = 1

  - entity: DESTINATIONS
    source_table: SYNTHETIC_DATASETS.UNIFIED.DIM_POIS
    materialization: view
    sql: |
      SELECT
          p.LOCATION_ID AS ID,
          -- Strip the wrapping double quotes the loader leaves on every POI name
          -- (measured: ALL 16,847 rows in DIM_POIS, both regions, e.g. '"BP"').
          -- Without this the agent answers with a quoted token and the UI shows
          -- '"$6 Bowl Shop"'. The real fix belongs in the writer - see NOTE in
          -- data-model.yaml - this keeps the contract clean meanwhile.
          REGEXP_REPLACE(p.NAME, '^"|"$', '') AS NAME,
          p.LOCATION_TYPE,
          p.CATEGORY AS BASIC_CATEGORY,
          -- CITY is the human-readable form of the region key, NOT the key
          -- itself. It used to be `p.REGION AS CITY`, so the column advertised
          -- a city and held 'SanFrancisco' - unmatchable against the phrase a
          -- person types.
          FLEET_APP.CORE.REGION_LABEL(p.REGION) AS CITY,
          p.POINT_GEOM AS GEOMETRY, p.REGION
      FROM SYNTHETIC_DATASETS.UNIFIED.DIM_POIS p
      WHERE p.LOCATION_TYPE NOT IN ('REST_STOP')
      QUALIFY ROW_NUMBER() OVER (PARTITION BY p.LOCATION_ID ORDER BY p.NAME) = 1

  - entity: REST_STOPS
    source_table: SYNTHETIC_DATASETS.UNIFIED.DIM_POIS
    materialization: view
    sql: |
      SELECT
          p.LOCATION_ID AS REST_STOP_ID,
          REGEXP_REPLACE(p.NAME, '^"|"$', '') AS NAME,
          p.CATEGORY AS REST_TYPE, p.POINT_GEOM AS CENTER_POINT, p.REGION
      FROM SYNTHETIC_DATASETS.UNIFIED.DIM_POIS p
      WHERE p.LOCATION_TYPE = 'REST_STOP'
      QUALIFY ROW_NUMBER() OVER (PARTITION BY p.LOCATION_ID ORDER BY p.NAME) = 1

  - entity: CONFIG
    source_table: FLEET_INTELLIGENCE.DWELL_ANALYSIS.CONFIG
    materialization: view
    passthrough: true
