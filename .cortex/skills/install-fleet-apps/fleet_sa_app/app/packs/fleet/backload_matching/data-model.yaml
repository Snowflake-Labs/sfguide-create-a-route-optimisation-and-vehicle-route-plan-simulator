# =============================================================================
# Data model (logical contract) - Fleet domain pack: backload_matching (SELF-BUILDING)
# =============================================================================
# Neutral, industry-agnostic backload-matching contract. Rebuilds the three
# consumer facts the Backload Matching page (TSX) + SV_BACKLOAD_MATCHING bind to,
# entirely from the shared synthetic substrate (SYNTHETIC_DATASETS.UNIFIED.V_*_CURRENT):
#   TRAILERS          <- V_DIM_FLEET_CURRENT + last drop-off from V_FACT_TRIPS_CURRENT
#   INTERNAL_VOLUMES  <- 120 most-recent V_FACT_TRIPS_CURRENT rows (waiting internal loads)
#   EXTERNAL_OFFERS   <- V_FACT_OFFERS_CURRENT (external freight offers), weight rescaled
# Two context leaves bind to physical control/reference tables in
# FLEET_INTELLIGENCE.BACKLOAD_MATCHING (created + seeded by scripts/analytic_layer.sql):
#   CONFIG                 - single active (VEHICLE_TYPE, REGION) preset row
#   VEHICLE_CLASS          - per-vehicle-class capacity / cost / label profile
#   PROPOSAL_DECISIONS     - dispatcher write-back audit (real table; the page writes via /api/write)
# Swap boundary = the shared V_*_CURRENT projection views + these control tables.
# No third-party / vendor branding anywhere: offer SOURCE + LISTING_TEXT are neutral.
# =============================================================================

pack: backload_matching
app_schema: FLEET_APP.BACKLOAD_MATCHING

entities:
  # ---- Context / reference leaves (mapped from physical control tables) -------
  - name: CONFIG
    description: "Active (VEHICLE_TYPE, REGION) preset that filters every backload view."
    access_pattern: context
    grain: "One row"
    columns:
      - { name: VEHICLE_TYPE, type: VARCHAR }
      - { name: REGION,       type: VARCHAR }

  - name: VEHICLE_CLASS
    description: "Per-vehicle-class capacity, cost, ORS profile and UI label profile."
    access_pattern: context
    grain: "One row per vehicle class"
    primary_key: VEHICLE_TYPE
    columns:
      - { name: VEHICLE_TYPE,    type: VARCHAR }
      - { name: ORS_PROFILE,     type: VARCHAR }
      - { name: PAYLOAD_KG_TYP,  type: NUMBER }
      - { name: PAYLOAD_KG_MAX,  type: NUMBER }
      - { name: SHIPMENT_KG_MIN, type: NUMBER }
      - { name: SHIPMENT_KG_MAX, type: NUMBER }
      - { name: AVG_SPEED_KMH,   type: NUMBER }
      - { name: COST_PER_KM,     type: FLOAT }
      - { name: COST_PER_HR,     type: FLOAT }
      - { name: HOME_RANGE_KM,   type: NUMBER }
      - { name: LABEL_NOUN,      type: VARCHAR }

  - name: MATCH_PARAMS
    description: "Config-driven matching constraints (radius, time, capacity, chain/target, cascade, equipment). Read as a contract view so the derived facts never reach across into FLEET_INTELLIGENCE."
    access_pattern: context
    grain: "One row per parameter key"
    primary_key: PARAM_KEY
    columns:
      - { name: PARAM_KEY,   type: VARCHAR }
      - { name: PARAM_VALUE, type: VARCHAR }
      - { name: PARAM_TYPE,  type: VARCHAR }
      - { name: CATEGORY,    type: VARCHAR }
      - { name: ENABLED,     type: BOOLEAN }
      - { name: DESCRIPTION, type: VARCHAR }

  - name: PROPOSAL_DECISIONS
    description: "Dispatcher decision audit (accept/reject a trailer<->load match)."
    access_pattern: context
    grain: "One row per decision"
    primary_key: DECISION_ID
    columns:
      - { name: DECISION_ID, type: VARCHAR }
      - { name: TRAILER_ID,  type: VARCHAR }
      - { name: OFFER_ID,    type: VARCHAR }
      - { name: SOURCE,      type: VARCHAR }
      - { name: SCORE,       type: FLOAT }
      - { name: EMPTY_KM,    type: FLOAT }
      - { name: NET_BENEFIT_USD, type: FLOAT }
      - { name: DECIDED_BY,  type: VARCHAR }
      - { name: DECIDED_AT,  type: TIMESTAMP_NTZ }
      - { name: RATIONALE,   type: VARCHAR }

  # ---- Consumer-facing derived facts -----------------------------------------
  - name: TRAILERS
    description: "Idle / returning trailers with home depot, last drop-off and capacity."
    access_pattern: derived
    depends_on: [CONFIG, VEHICLE_CLASS]
    materialization: view
    columns:
      - { name: TRAILER_ID,     type: VARCHAR }
      - { name: OPERATING_COUNTRY, type: VARCHAR }
      - { name: MAX_PAYLOAD_KG, type: NUMBER }
      - { name: ETA_MIN,        type: NUMBER }
      - { name: EV_RANGE_KM,    type: NUMBER }
    sql: |
      WITH last_drop AS (
        SELECT VEHICLE_ID,
               MAX_BY(DESTINATION_LON, TRIP_END)    AS DROPOFF_LON,
               MAX_BY(DESTINATION_LAT, TRIP_END)    AS DROPOFF_LAT,
               MAX_BY(DESTINATION_POI_ID, TRIP_END) AS DROPOFF_POI_ID,
               MAX(TRIP_END)                        AS LAST_TRIP_END
        FROM SYNTHETIC_DATASETS.UNIFIED.V_FACT_TRIPS_CURRENT
        WHERE REGION       = (SELECT REGION       FROM {schema}.VW_CONFIG LIMIT 1)
          AND VEHICLE_TYPE = (SELECT VEHICLE_TYPE FROM {schema}.VW_CONFIG LIMIT 1)
        GROUP BY VEHICLE_ID
      ),
      home_anchor AS (
        SELECT AVG(LAT) AS HOME_LAT, AVG(LNG) AS HOME_LON
        FROM SYNTHETIC_DATASETS.UNIFIED.V_DIM_POIS_CURRENT
        WHERE REGION = (SELECT REGION FROM {schema}.VW_CONFIG LIMIT 1)
      ),
      cls AS (
        SELECT * FROM {schema}.VW_VEHICLE_CLASS
        WHERE VEHICLE_TYPE = (SELECT VEHICLE_TYPE FROM {schema}.VW_CONFIG LIMIT 1)
      ),
      p AS (
        SELECT COALESCE(MAX(IFF(PARAM_KEY='PLANNING_LEAD_DAYS', TRY_TO_DOUBLE(PARAM_VALUE), NULL)), 4) AS LEAD_DAYS
        FROM {schema}.VW_MATCH_PARAMS
      )
      SELECT
        f.VEHICLE_ID                                        AS TRAILER_ID,
        f.REGION                                            AS OPERATING_COUNTRY,
        COALESCE(h.NAME, 'Home Depot')                      AS HOME_DEPOT,
        COALESCE(h.LNG, (SELECT HOME_LON FROM home_anchor)) AS HOME_LON,
        COALESCE(h.LAT, (SELECT HOME_LAT FROM home_anchor)) AS HOME_LAT,
        f.VEHICLE_TYPE                                      AS CURRENT_LOAD,
        COALESCE(d.NAME, 'Drop-off')                        AS DROPOFF_CITY,
        ld.DROPOFF_LON                                      AS DROPOFF_LON,
        ld.DROPOFF_LAT                                      AS DROPOFF_LAT,
        ld.LAST_TRIP_END                                    AS ETA_TS,
        DATEDIFF('minute', CURRENT_TIMESTAMP(), ld.LAST_TRIP_END) AS ETA_MIN,
        -- Dispatch-time availability: a vehicle still in transit is plannable
        -- NOW for the moment it frees up, so its free time is that future
        -- arrival. Where the synthetic drop-off is already past there is no
        -- future arrival to use, so the free time is spread deterministically
        -- across PLANNING_LEAD_DAYS. AVAILABILITY_BASIS reports which applied
        -- rather than hiding the synthesis.
        CASE
          WHEN ld.LAST_TRIP_END > CURRENT_TIMESTAMP() THEN ld.LAST_TRIP_END
          ELSE DATEADD('minute',
                 MOD(ABS(HASH(f.VEHICLE_ID)), GREATEST(1, ((SELECT LEAD_DAYS FROM p) * 1440)::INT)),
                 CURRENT_TIMESTAMP())
        END                                                 AS AVAILABLE_FROM_TS,
        IFF(ld.LAST_TRIP_END > CURRENT_TIMESTAMP(), 'eta', 'projected') AS AVAILABILITY_BASIS,
        -- Chain target under TARGET_MODE=home_depot. A per-request target
        -- (dispatcher_choice) is supplied at query time and falls back to this.
        COALESCE(h.LNG, (SELECT HOME_LON FROM home_anchor)) AS TARGET_LON,
        COALESCE(h.LAT, (SELECT HOME_LAT FROM home_anchor)) AS TARGET_LAT,
        COALESCE(h.NAME, 'Home Depot')                      AS TARGET_LABEL,
        ST_DISTANCE(
          ST_MAKEPOINT(ld.DROPOFF_LON, ld.DROPOFF_LAT),
          ST_MAKEPOINT(COALESCE(h.LNG, (SELECT HOME_LON FROM home_anchor)),
                       COALESCE(h.LAT, (SELECT HOME_LAT FROM home_anchor)))
        ) / 1000.0                                          AS TARGET_GAP_KM,
        'IN_TRANSIT'                                        AS STATUS,
        FALSE                                               AS HAZMAT_CERT,
        (SELECT PAYLOAD_KG_TYP FROM cls)::NUMBER            AS MAX_PAYLOAD_KG,
        NULLIF(f.BATTERY_RANGE_KM, 0)                       AS EV_RANGE_KM
      FROM SYNTHETIC_DATASETS.UNIFIED.V_DIM_FLEET_CURRENT f
      JOIN last_drop ld ON ld.VEHICLE_ID = f.VEHICLE_ID
      LEFT JOIN SYNTHETIC_DATASETS.UNIFIED.V_DIM_POIS_CURRENT h ON h.LOCATION_ID = f.HOME_LOCATION_ID
      LEFT JOIN SYNTHETIC_DATASETS.UNIFIED.V_DIM_POIS_CURRENT d ON d.LOCATION_ID = ld.DROPOFF_POI_ID
      WHERE f.REGION       = (SELECT REGION       FROM {schema}.VW_CONFIG LIMIT 1)
        AND f.VEHICLE_TYPE = (SELECT VEHICLE_TYPE FROM {schema}.VW_CONFIG LIMIT 1)
        AND EXISTS (SELECT 1 FROM cls)

  - name: INTERNAL_VOLUMES
    description: "Recent internal loads waiting for a backhaul (class-clamped weight, future pickup window)."
    access_pattern: derived
    depends_on: [CONFIG, VEHICLE_CLASS]
    materialization: view
    columns:
      - { name: ID,        type: VARCHAR }
      - { name: WEIGHT_KG, type: NUMBER }
    sql: |
      WITH cls AS (
        SELECT * FROM {schema}.VW_VEHICLE_CLASS
        WHERE VEHICLE_TYPE = (SELECT VEHICLE_TYPE FROM {schema}.VW_CONFIG LIMIT 1)
      ),
      -- Pickup windows are spread across the PLANNING_LEAD_DAYS horizon, not the
      -- next ~10 hours. Vehicle availability is forward-looking (see TRAILERS),
      -- so a pool bunched into today is reachable only by vehicles free today
      -- and silently starves every later vehicle of candidates.
      p AS (
        SELECT
          COALESCE(MAX(IFF(PARAM_KEY='PLANNING_LEAD_DAYS', TRY_TO_DOUBLE(PARAM_VALUE), NULL)), 4)    AS LEAD_DAYS,
          COALESCE(MAX(IFF(PARAM_KEY='INTERNAL_POOL_CAP',  TRY_TO_DOUBLE(PARAM_VALUE), NULL)), 5000) AS POOL_CAP
        FROM {schema}.VW_MATCH_PARAMS
      )
      SELECT
        'INT-' || LPAD(ROW_NUMBER() OVER (ORDER BY t.TRIP_START)::VARCHAR, 5, '0') AS ID,
        COALESCE(o.NAME, 'Origin')                                                  AS PICKUP_CITY,
        t.ORIGIN_LON                                                                AS PICKUP_LON,
        t.ORIGIN_LAT                                                                AS PICKUP_LAT,
        COALESCE(d.NAME, 'Destination')                                             AS DROPOFF_CITY,
        t.DESTINATION_LON                                                           AS DROPOFF_LON,
        t.DESTINATION_LAT                                                           AS DROPOFF_LAT,
        GREATEST(
          t.TRIP_START,
          DATEADD('minute',
            MOD(ABS(HASH(t.TRIP_ID)), GREATEST(1, ((SELECT LEAD_DAYS FROM p) * 1440)::INT)) + 30,
            CURRENT_TIMESTAMP())
        )                                                                           AS PICKUP_FROM_TS,
        DATEADD(hour, 4,
          GREATEST(
            t.TRIP_START,
            DATEADD('minute',
              MOD(ABS(HASH(t.TRIP_ID)), GREATEST(1, ((SELECT LEAD_DAYS FROM p) * 1440)::INT)) + 30,
              CURRENT_TIMESTAMP())
          )
        )                                                                           AS PICKUP_TO_TS,
        (
          (SELECT SHIPMENT_KG_MIN FROM cls)
          + ABS(HASH(t.TRIP_ID)) % NULLIF(((SELECT SHIPMENT_KG_MAX FROM cls) - (SELECT SHIPMENT_KG_MIN FROM cls)), 0)
        )::NUMBER                                                                   AS WEIGHT_KG,
        'B2B pallets'                                                               AS PRODUCT,
        FALSE                                                                       AS HAZMAT
      FROM SYNTHETIC_DATASETS.UNIFIED.V_FACT_TRIPS_CURRENT t
      LEFT JOIN SYNTHETIC_DATASETS.UNIFIED.V_DIM_POIS_CURRENT o ON o.LOCATION_ID = t.ORIGIN_POI_ID
      LEFT JOIN SYNTHETIC_DATASETS.UNIFIED.V_DIM_POIS_CURRENT d ON d.LOCATION_ID = t.DESTINATION_POI_ID
      WHERE t.REGION       = (SELECT REGION       FROM {schema}.VW_CONFIG LIMIT 1)
        AND t.VEHICLE_TYPE = (SELECT VEHICLE_TYPE FROM {schema}.VW_CONFIG LIMIT 1)
        AND EXISTS (SELECT 1 FROM cls)
      QUALIFY ROW_NUMBER() OVER (ORDER BY t.TRIP_START DESC) <= (SELECT POOL_CAP FROM p)

  - name: EXTERNAL_OFFERS
    description: "External freight-exchange offers for the active region, weight rescaled into the class band. Neutral SOURCE / LISTING_TEXT (no vendor branding)."
    access_pattern: derived
    depends_on: [CONFIG, VEHICLE_CLASS]
    materialization: view
    replaces: FLEET_INTELLIGENCE.BACKLOAD_MATCHING.VW_EXTERNAL_OFFERS
    columns:
      - { name: OFFER_ID,          type: VARCHAR }
      - { name: SOURCE,            type: VARCHAR }
      - { name: SOURCE_SYSTEM,     type: VARCHAR }
      - { name: VEHICLE_EQUIPMENT, type: VARCHAR }
      - { name: WEIGHT_KG,         type: NUMBER }
      - { name: PRICE_USD,         type: NUMBER }
    sql: |
      WITH cls AS (
        SELECT * FROM {schema}.VW_VEHICLE_CLASS
        WHERE VEHICLE_TYPE = (SELECT VEHICLE_TYPE FROM {schema}.VW_CONFIG LIMIT 1)
      ),
      p AS (
        SELECT COALESCE(MAX(IFF(PARAM_KEY='PLANNING_LEAD_DAYS', TRY_TO_DOUBLE(PARAM_VALUE), NULL)), 4) AS LEAD_DAYS
        FROM {schema}.VW_MATCH_PARAMS
      ),
      -- Rebase each offer's pickup window onto the live planning horizon while
      -- preserving its own window LENGTH. Generated timestamps are relative to
      -- generation time, so on any dataset older than a day they already sit in
      -- the past - and with forward-looking vehicle availability a past pickup
      -- can never be served, which empties the external half of the demand pool
      -- with no error anywhere.
      shifted AS (
        SELECT
          f.*,
          GREATEST(
            f.PICKUP_FROM_TS,
            DATEADD('minute',
              MOD(ABS(HASH(f.OFFER_ID)), GREATEST(1, ((SELECT LEAD_DAYS FROM p) * 1440)::INT)) + 30,
              CURRENT_TIMESTAMP())
          ) AS PICKUP_FROM_TS_ADJ,
          GREATEST(60, COALESCE(DATEDIFF('minute', f.PICKUP_FROM_TS, f.PICKUP_TO_TS), 240)) AS WINDOW_MIN
        FROM SYNTHETIC_DATASETS.UNIFIED.V_FACT_OFFERS_CURRENT f
        WHERE f.REGION = (SELECT REGION FROM {schema}.VW_CONFIG LIMIT 1)
      )
      SELECT
        f.OFFER_ID,
        f.SOURCE,
        -- SOURCE is a CHANNEL label whose values mix internal and external
        -- (INTERNAL / DISPATCH / MARKETPLACE / PARTNER_APP), so it cannot answer
        -- "did this come from outside". SOURCE_SYSTEM is the system identity: a
        -- real integration replaces the literal with its own system key, and no
        -- consumer changes. Deliberately vendor-free.
        'EXTERNAL_EXCHANGE'                      AS SOURCE_SYSTEM,
        COALESCE(f.VEHICLE_EQUIPMENT, 'ANY')     AS VEHICLE_EQUIPMENT,
        COALESCE(SUBSTR(f.REGION, 1, 2), 'US')   AS PICKUP_COUNTRY,
        COALESCE(SUBSTR(f.REGION, 1, 2), 'US')   AS DROPOFF_COUNTRY,
        COALESCE(p2.NAME, 'Pickup')              AS PICKUP_CITY,
        f.PICKUP_LON,
        f.PICKUP_LAT,
        COALESCE(d.NAME, 'Dropoff')              AS DROPOFF_CITY,
        f.DROPOFF_LON,
        f.DROPOFF_LAT,
        f.PICKUP_FROM_TS_ADJ                     AS PICKUP_FROM_TS,
        DATEADD('minute', f.WINDOW_MIN, f.PICKUP_FROM_TS_ADJ) AS PICKUP_TO_TS,
        LEAST(
          (SELECT SHIPMENT_KG_MAX FROM cls),
          GREATEST(
            (SELECT SHIPMENT_KG_MIN FROM cls),
            ((SELECT SHIPMENT_KG_MIN FROM cls) + ABS(HASH(f.OFFER_ID)) % NULLIF(((SELECT SHIPMENT_KG_MAX FROM cls) - (SELECT SHIPMENT_KG_MIN FROM cls)), 0))::NUMBER
          )
        )                                        AS WEIGHT_KG,
        COALESCE(f.PRODUCT, 'General freight')   AS PRODUCT,
        f.PRICE_USD                              AS PRICE_USD,
        COALESCE(f.HAZMAT, FALSE)                AS HAZMAT,
        f.SOURCE || ' load: ' || COALESCE(p2.NAME, 'Pickup') || ' -> ' || COALESCE(d.NAME, 'Dropoff') AS LISTING_TEXT
      FROM shifted f
      LEFT JOIN SYNTHETIC_DATASETS.UNIFIED.V_DIM_POIS_CURRENT p2 ON p2.LOCATION_ID = f.PICKUP_POI_ID
      LEFT JOIN SYNTHETIC_DATASETS.UNIFIED.V_DIM_POIS_CURRENT d  ON d.LOCATION_ID  = f.DROPOFF_POI_ID
      WHERE EXISTS (SELECT 1 FROM cls)
