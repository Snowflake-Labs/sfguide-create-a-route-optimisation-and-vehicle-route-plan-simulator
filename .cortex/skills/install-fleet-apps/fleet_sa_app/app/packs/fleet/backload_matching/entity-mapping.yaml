# Entity mapping - backload_matching pack - SOURCE: synthetic
# The three consumer facts (TRAILERS / INTERNAL_VOLUMES / EXTERNAL_OFFERS) are
# DERIVED in data-model.yaml directly over the shared SYNTHETIC_DATASETS.UNIFIED.V_*_CURRENT
# projection views, so they need no source binding here. Only the physical control /
# reference / audit leaves are bound (passthrough) to their FLEET_INTELLIGENCE.BACKLOAD_MATCHING
# tables, which scripts/analytic_layer.sql creates + seeds. A customer swap re-points
# these leaves (and the V_*_CURRENT sources in data-model.yaml) with no consumer change.
source_id: synthetic
description: "Bundled synthetic backload-matching data (trailers, internal loads, external offers)."
entities:
  - entity: CONFIG
    source_table: FLEET_INTELLIGENCE.BACKLOAD_MATCHING.CONFIG
    materialization: view
    passthrough: true

  - entity: VEHICLE_CLASS
    source_table: FLEET_INTELLIGENCE.BACKLOAD_MATCHING.VEHICLE_CLASS_PROFILE
    materialization: view
    passthrough: true

  - entity: PROPOSAL_DECISIONS
    source_table: FLEET_INTELLIGENCE.BACKLOAD_MATCHING.PROPOSAL_DECISIONS
    materialization: view
    passthrough: true
