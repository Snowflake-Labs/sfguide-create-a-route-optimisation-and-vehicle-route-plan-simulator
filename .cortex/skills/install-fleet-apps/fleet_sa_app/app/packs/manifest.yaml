# =============================================================================
# Domain-pack manifest - drives deterministic install order + runtime surfacing.
# =============================================================================
# Consumed by:
#   _lib/install.py        - regenerate + apply every pack's setup.sql in
#                            dependency order (idempotent).
#   the SA app surfacing gate (/api/pack-status) - a pack's dashboards + agent
#                            tools register only when its `probe` view resolves
#                            with rows.
#
# Per pack:
#   name         logical pack id (dir under fleet/)
#   app_schema   neutral FLEET_APP.<schema> the consumers bind to
#   depends_on   other packs that must install first (inter-pack contract deps)
#   probe        a consumer view; install/gate treat COUNT(*) > 0 as "present"
#   semantic_views  SVs repointed onto this pack (doc; repoint via generate.py --sv-repoint)
#   self_building   true once the analytic layer is rebuilt from raw sources
# =============================================================================

packs:
  - name: starter
    app_schema: STARTER_APP.CORE
    probe: STARTER_APP.CORE.VW_LOCATIONS
    semantic_views: [STARTER_APP.SEMANTIC.SV_STARTER]
    self_building: false   # neutral reference pack; maps from SYNTHETIC_DATASETS.NEUTRAL substrate

  - name: route_deviation
    app_schema: FLEET_APP.ROUTE_DEVIATION
    depends_on: [unified_fleet]    # VW_TRIP_DEVIATION / VW_TRIP_GPS_POINTS read the catalog FLEET_APP.UNIFIED_FLEET.VW_VEHICLE_PROFILE
    probe: FLEET_APP.ROUTE_DEVIATION.VW_TRIP_DEVIATION
    semantic_views: [FLEET_INTELLIGENCE.SEMANTIC.SV_ROUTE_DEVIATION]
    self_building: true

  - name: dwell
    app_schema: FLEET_APP.DWELL
    depends_on: [unified_fleet]    # VW_SLA_ALERTS reads the catalog FLEET_APP.UNIFIED_FLEET.VW_VEHICLE_DWELL_SLA
    probe: FLEET_APP.DWELL.VW_DWELL_SESSIONS
    semantic_views: [FLEET_INTELLIGENCE.SEMANTIC.SV_DWELL_ANALYTICS]
    self_building: true

  # FLEET_OPS - the ONE universal, mode-agnostic analytics layer (R6). Supersedes the
  # retired taxi + food_delivery packs. Its schema, dataset-scoped intent UDTFs, and
  # global-active views are authored in app/scoped_contract.sql (applied by install.py
  # after unified_fleet); this pack's setup.sql only ensures the schema + role USAGE so
  # install ordering + the surfacing probe resolve. depends_on unified_fleet (FLEET_OPS
  # binds to the neutral FLEET_APP.UNIFIED_FLEET.F_VW_*_SCOPED contract).
  - name: fleet_ops
    app_schema: FLEET_APP.FLEET_OPS
    depends_on: [unified_fleet]
    probe: FLEET_APP.FLEET_OPS.VW_TRIPS
    semantic_views: [FLEET_INTELLIGENCE.SEMANTIC.SV_FLEET_OPS]
    self_building: true   # rebuilt from raw sources via the scoped_contract UDTFs

  - name: catchment
    app_schema: FLEET_APP.CATCHMENT
    probe: FLEET_APP.CATCHMENT.VW_POIS
    semantic_views: [FLEET_INTELLIGENCE.SEMANTIC.SV_CATCHMENT]
    self_building: false   # binds base tables directly (already at swap boundary)

  - name: unified_fleet
    app_schema: FLEET_APP.UNIFIED_FLEET
    probe: FLEET_APP.UNIFIED_FLEET.VW_FACT_TRIPS
    semantic_views: [FLEET_INTELLIGENCE.SEMANTIC.SV_FLEET_OPERATIONS]
    self_building: false   # binds shared SYNTHETIC_DATASETS.UNIFIED.V_*_CURRENT

  - name: route_optimization
    app_schema: FLEET_APP.ROUTE_OPTIMIZATION
    depends_on: [dwell]    # IDLE_TRAILERS reads FLEET_APP.DWELL.VW_DWELL_SESSIONS
    probe: FLEET_APP.ROUTE_OPTIMIZATION.VW_VEHICLE_COST_OF_IDLENESS
    semantic_views: [FLEET_INTELLIGENCE.SEMANTIC.SV_ASSET_VELOCITY]
    self_building: true

  # Region-generic Emergency Response. Hazard (procedural worldwide H3 grid) +
  # care centers (Overture health anchors) + participants (Overture residential
  # buildings) are produced by Data Studio (generates_hazard + generates_anchors
  # + generates_participants). The contract views live in
  # app/scoped_contract.sql; this pack's setup.sql only ensures the schema +
  # role USAGE so install ordering + the surfacing probe resolve. The probe
  # gates the pack OFF account-wide when no region has hazard data yet (e.g. a
  # non-US-only install); per-region availability is handled in the wizard.
  - name: emergency_response
    app_schema: FLEET_APP.EMERGENCY_RESPONSE
    depends_on: [unified_fleet]
    probe: FLEET_APP.EMERGENCY_RESPONSE.VW_HAZARD_ZONES
    self_building: true

  # Backload Matching - neutral, vehicle/industry-agnostic (no vendor branding).
  # Rebuilds trailers / internal loads / external offers from the shared synthetic
  # substrate + FLEET_INTELLIGENCE.BACKLOAD_MATCHING control tables (seeded by
  # scripts/analytic_layer.sql). Consumer: backload_matching (TSX) + SV_BACKLOAD_MATCHING.
  - name: backload_matching
    app_schema: FLEET_APP.BACKLOAD_MATCHING
    depends_on: [unified_fleet]
    probe: FLEET_APP.BACKLOAD_MATCHING.VW_TRAILERS
    semantic_views: [FLEET_INTELLIGENCE.SEMANTIC.SV_BACKLOAD_MATCHING]
    self_building: true

  # NOTE: the remaining industry-vertical packs (marketplace, plus a retired
  # vertical pack) are
  # intentionally EXCLUDED from this vehicle/industry-agnostic installer.
